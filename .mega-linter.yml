# MegaLinter configuration
# See all config options: https://megalinter.io/latest/config-file/

# General
APPLY_FIXES: none
SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
PRINT_ALPACA: false
FLAVOR_SUGGESTIONS: false

# Linters to enable/disable
ENABLE_LINTERS:
  - MARKDOWN_MARKDOWNLINT
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  - YAML_PRETTIER
  - YAML_YAMLLINT
  - JSON_PRETTIER
  - JSON_JSONLINT
  - TYPESCRIPT_BIOME
  - JAVASCRIPT_BIOME
  - DOCKERFILE_HADOLINT
  - ACTION_ACTIONLINT
  - BASH_SHELLCHECK
  - BASH_SHFMT

DISABLE_LINTERS:
  - SPELL_CSPELL
  - SPELL_LYCHEE
  - COPYPASTE_JSCPD

# Linter-specific config
TYPESCRIPT_DEFAULT_STYLE: biome
JAVASCRIPT_DEFAULT_STYLE: biome
YAML_PRETTIER_FILTER_REGEX_EXCLUDE: "(pnpm-lock)"
JSON_PRETTIER_FILTER_REGEX_EXCLUDE: "(pnpm-lock|package\.json)"
MARKDOWN_MARKDOWNLINT_FILTER_REGEX_EXCLUDE: "(\.gitnexus|llm-wiki)"
MARKDOWN_MARKDOWN_TABLE_FORMATTER_FILTER_REGEX_EXCLUDE: "(\.gitnexus|llm-wiki)"
