# Lefthook — Git hooks for Aigency monorepo
# Replaces Husky. Runs fast, parallel-safe, no node_modules pollution.
# Docs: https://evilmartians.github.io/lefthook/

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{js,ts,jsx,tsx,json,cjs,mjs}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
    biome-format-md-json:
      glob: "*.{md,json}"
      run: pnpm exec biome format --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
    typecheck-affected:
      run: pnpm exec turbo run typecheck --affected

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm exec turbo run lint
    typecheck:
      run: pnpm exec turbo run typecheck
    test:
      run: pnpm exec turbo run test
