name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Collect test results in JUnit format for Codecov test analytics
  VITEST_JUNIT_OUTPUT_DIR: ./coverage
  VITEST_JUNIT_OUTPUT_FILE: junit.xml

jobs:
  test-and-upload:
    name: Test with Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      # Upload per-package coverage with flags for component tracking
      - name: Upload agent-core coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/agent-core/coverage/lcov.info
          flags: agent-core
          name: agent-core
          fail_ci_if_error: false

      - name: Upload honcho coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/honcho/coverage/lcov.info
          flags: honcho
          name: honcho
          fail_ci_if_error: false

      - name: Upload mem-brain coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/mem-brain/coverage/lcov.info
          flags: mem-brain
          name: mem-brain
          fail_ci_if_error: false

      - name: Upload surreal coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/surreal/coverage/lcov.info
          flags: surreal
          name: surreal
          fail_ci_if_error: false

      - name: Upload vault-tools coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/vault-tools/coverage/lcov.info
          flags: vault-tools
          name: vault-tools
          fail_ci_if_error: false

      - name: Upload router coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/router/coverage/lcov.info
          flags: router
          name: router
          fail_ci_if_error: false

      # Upload test results for flaky test detection
      # https://docs.codecov.com/docs/test-analytics
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            packages/agent-core/coverage/junit.xml
            packages/honcho/coverage/junit.xml
            packages/mem-brain/coverage/junit.xml
            packages/surreal/coverage/junit.xml
            packages/vault-tools/coverage/junit.xml
            apps/router/coverage/junit.xml
          fail_ci_if_error: false

      - name: Check coverage thresholds
        run: ./scripts/automation/coverage-check.sh --ci
