services:
  - type: web
    name: repoatlas-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install && pnpm --filter repoatlas-server build
    startCommand: pnpm --filter repoatlas-server start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: repoatlas-db
          property: connectionString
      - key: API_TOKEN
        generateValue: true
      - key: APPLY_MIGRATIONS
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
      - key: NODE_ENV
        value: production

databases:
  - name: repoatlas-db
    plan: free
