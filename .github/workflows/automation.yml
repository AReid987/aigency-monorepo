name: Aigency Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitnexus-sync:
    name: GitNexus Knowledge Graph Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Sync GitNexus
        run: pnpm turbo run gitnexus:sync

  docs-staleness-check:
    name: Docs Staleness Check
    runs-on: ubuntu-latest
    needs: gitnexus-sync
    steps:
      - uses: actions/checkout@v4
      - name: Check docs freshness
        run: ./scripts/automation/docs-staleness-check.sh
      - name: Upload stale state
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-stale-state
          path: |
            docs-stale.marker
            stale-files.txt
      - name: Discord alert (stale docs)
        if: failure()
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: "🧠 Aigency docs are stale. Wiki regeneration needed."

  docs-build:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: docs-staleness-check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run docs:build

  agentic-trigger:
    name: Agentic Wiki Regeneration Trigger
    runs-on: ubuntu-latest
    needs: docs-staleness-check
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Trigger wiki regen (dry-run)
        run: pnpm turbo run docs:regen
      - name: Create regeneration issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🧠 Wiki regeneration needed — docs stale',
              body: 'The docs staleness check detected outdated wiki pages.\\n\\nRun `pnpm wiki:lint` and tell the LLM to regenerate affected pages.',
              labels: ['wiki', 'automation', 'stale']
            });
